name: release-gates

on:
    push:
        branches:
            - main
            - develop
    pull_request:

jobs:
    frontend-gates:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm run test

            - name: Run build
              run: npm run build

            - name: Lint (warning gate)
              run: npm run lint
              continue-on-error: true
